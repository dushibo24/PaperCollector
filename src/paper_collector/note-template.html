<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{{TITLE}} · 论文阅读笔记</title>
<style>
:root{color-scheme:light;--ink:#252b29;--muted:#737b76;--paper:#fbfaf7;--line:#e2e3dc;--accent:#32634f}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:28px}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.95 Georgia,"Noto Serif SC","Songti SC",serif}
a{color:var(--accent);overflow-wrap:anywhere}
#reading-progress{position:fixed;top:0;left:0;width:100%;height:3px;border:0;z-index:5;accent-color:var(--accent)}
.layout{display:grid;grid-template-columns:180px minmax(0,760px);gap:64px;max-width:1100px;padding:56px 28px 72px;margin:auto}
aside{align-self:start;position:sticky;top:36px;font:13px/1.8 system-ui,sans-serif}
.toc-label{color:var(--muted);margin:0 0 12px}
nav a{display:block;padding:7px 0;text-decoration:none}
main{min-width:0}
header{margin-bottom:26px}
.eyebrow{font:12px/1.5 system-ui,sans-serif;color:var(--muted);margin:0}
h1{font-size:clamp(26px,3.3vw,36px);line-height:1.45;letter-spacing:-.02em;text-wrap:balance;margin:14px 0}
.subtitle{font-size:19px;line-height:1.8;margin:12px 0;color:var(--accent)}
.original-title{font:13px/1.65 system-ui,sans-serif;color:var(--muted);margin:12px 0}
.paper-brief{padding:0 0 24px;border-bottom:1px solid var(--line)}
.paper-brief p{margin:0}
section{margin-top:44px}
h2{font-size:25px;line-height:1.5;margin:0 0 24px}
h3{font-size:20px;line-height:1.6;margin:30px 0 10px}
h4{font-size:16px;line-height:1.7;margin:20px 0 6px}
.paragraph{margin:16px 0 22px}
.paragraph p{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.paragraph-heading{font-size:19px;line-height:1.65;margin:28px 0 8px}
.source-ref{font:11px/1.6 system-ui,sans-serif!important;color:var(--muted);margin:5px 0 0!important}
.analysis-label{font:12px/1.8 system-ui,sans-serif;color:var(--muted)}
.artifact{margin:30px 0 38px;padding:0}
.artifact>h3{font-size:17px;margin:0 0 12px}
.artifact small{font:11px/1.6 system-ui,sans-serif;color:var(--muted);white-space:nowrap}
.artifact img{display:block;width:100%;height:auto;background:white;border:1px solid var(--line)}
.artifact .paragraph{margin:14px 0}
.limit{color:#696458;font-size:15px}
.figure-details,.supporting-detail,.supporting-figure{margin:20px 0;padding:12px 0;border-top:1px solid var(--line)}
summary{cursor:pointer;font:14px/1.8 system-ui,sans-serif;color:var(--accent)}
details[open]>summary{margin-bottom:18px}
.appendix{margin:20px 0;padding:16px 0;border-top:1px solid var(--line)}
.appendix-body{padding:8px 0}
.appendix .paragraph-heading{font-size:17px}
pre{overflow:auto;background:#f0f0e9;padding:18px;border-radius:4px;font:13px/1.8 ui-monospace,monospace}
.table-scroll{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.8}
th,td{padding:12px;vertical-align:top;border:1px solid var(--line);min-width:140px}
th{background:#f0f1ea}
footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.mobile-toc{display:none}
@media(max-width:850px){
  .layout{display:block;padding:28px 22px 52px}
  aside{display:none}
  h1{font-size:27px}
  h2{font-size:23px}
  .subtitle{font-size:18px}
  .mobile-toc{display:block;margin:22px 0 30px;padding:10px 0;border-bottom:1px solid var(--line)}
  .mobile-toc nav{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .mobile-toc nav a{font:12px/1.7 system-ui,sans-serif}
  section{margin-top:34px}
}
@media print{
  aside,#reading-progress,.mobile-toc{display:none}
  .layout{display:block;padding:0}
  body{font-size:12pt;background:white}
  .artifact,pre{break-inside:avoid}
}
</style>
</head>
<body>
<progress id="reading-progress" max="100" value="0" aria-label="阅读进度"></progress>
<div class="layout">
<aside><p class="toc-label">本文目录</p><nav aria-label="阅读目录">{{NAVIGATION}}</nav></aside>
<main>
<header><p class="eyebrow">论文阅读笔记</p><h1>{{TITLE}}</h1><p class="subtitle">{{SUBTITLE}}</p><p class="original-title">{{ORIGINAL_TITLE}}</p></header>
{{BRIEF}}
<details class="mobile-toc"><summary>目录</summary><nav aria-label="移动阅读目录">{{NAVIGATION}}</nav></details>
{{SECTIONS}}
<footer>{{ORIGINAL_LINK}} · 页码均指物理 PDF 页码。图表内嵌于本页，可保存为 HTML 离线阅读。标有“笔记分析”的段落是解释或推论，请以原文为准。</footer>
</main>
</div>
<script>{{PROGRESS_SCRIPT}}</script>
</body>
</html>
