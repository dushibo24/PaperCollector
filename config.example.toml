# scope=niche：更看重内容本身，弱 venue 不会直接淘汰。
[[interests]]
name = "小同行：DDoS 测试、攻击与防御"
description = "以 DDoS 测试方法为首要关注点，攻击与防御研究次之。重点关注攻击流量建模与可控生成、攻击重放、测试床与网络靶场、仿真和仿真—实网结合、测试场景及拓扑构造、背景流量和攻击强度编排，以及检测、缓解和系统抗毁能力的指标、基准与评测方法。尤其希望看到能提高测试真实性、可重复性、安全隔离性、可扩展性和覆盖度，或能系统暴露现有防御盲区的通用测试框架、工具、数据集与方法论。攻防方面继续关注大流量、应用层、低速隐蔽、反射放大、僵尸网络和自适应攻击，以及检测、归因、源地址验证、流量清洗和可编程网络防御。优先推荐具有真实流量或大规模实验、公开实现、明确威胁模型和部署价值的工作；警惕把普通压力测试包装成 DDoS 测试、只在小型合成数据上做常规模型分类、测试变量控制不清、指标单一、缺少强基线或无法复现的论文。"
scope = "niche"
weight = 1.3
keywords = [
  "DDoS testing", "DDoS testbed", "DDoS benchmarking", "DDoS evaluation",
  "DDoS traffic generation", "DDoS attack emulation", "denial-of-service testing",
  "DDoS attack replay", "DDoS experiment", "DDoS testing framework",
  "DDoS resilience testing", "DDoS defense evaluation", "DDoS mitigation evaluation",
  "DDoS detection benchmark", "DDoS dataset", "cyber range DDoS",
  "realistic DDoS traffic", "reproducible DDoS experiment", "adversarial DDoS testing",
  "distributed denial of service", "DDoS attack", "DDoS detection", "DDoS defense",
  "DDoS mitigation", "denial-of-service attack", "volumetric attack",
  "application-layer DDoS", "low-rate DDoS", "reflection amplification attack",
  "botnet-based DDoS", "adaptive DDoS", "DDoS measurement", "DDoS traceback",
  "DDoS filtering", "traffic scrubbing", "source address validation",
]
negative_keywords = [
  "survey", "systematic literature review", "position paper",
  "software unit testing", "GUI testing", "web performance testing",
]

