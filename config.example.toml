# scope=niche：最高时效优先级；弱 venue 和零引用不构成淘汰理由，重点判断是否可能形成新范式。
[[interests]]
name = "小同行：前沿模型架构与训练范式突破"
description = "关注可能改变基础模型和智能体技术路线的原创架构、训练方法、后训练范式及推理时扩展方法。典型方向包括但不限于 Transformer 替代架构（如 Mamba 与状态空间模型、线性注意力）、稀疏与混合专家模型、扩散式或非自回归语言模型、世界模型，以及推理强化学习、可验证奖励、测试时计算、自改进 Agent、记忆和工具学习。最优先推荐提出新计算原语或新扩展规律、显著改善能力—效率—成本边界、解锁此前难以实现的能力，并可能快速产生后续工作的论文；一旦发现证据可信的类似突破，即使论文刚发布在 arXiv、尚未正式接收或没有引用，也应优先进入当天推荐。对于此类早期成果，重点核验作者或实验室的相关积累、方法完整性、缩放实验、强基线、公平算力比较、消融和可复现证据；排除旧模块重命名、简单拼接、只在小基准上微弱提升或依靠巨大额外算力制造优势的炒作性工作。"
scope = "niche"
weight = 1.3
keywords = [
  "novel model architecture", "foundation model architecture",
  "reinforcement learning for reasoning", "state space language model",
  "neural architecture", "new model architecture", "Mamba architecture",
  "Mamba language model", "state space model",
  "selective state space", "Transformer alternative", "linear attention",
  "hybrid attention architecture", "mixture of experts", "sparse mixture of experts",
  "mixture-of-experts", "test-time compute", "test time compute",
  "test-time scaling", "inference-time scaling", "inference time scaling",
  "reinforcement learning with verifiable rewards", "RLVR",
  "group relative policy optimization", "GRPO", "process reward model",
  "reasoning reinforcement learning", "reinforcement learning post-training",
  "reasoning model", "diffusion language model", "autoregressive alternative",
  "world model", "multimodal foundation model", "self-improving agent",
  "agent learning", "agentic architecture", "tool learning",
  "multi-agent learning", "long-context architecture", "memory-augmented model",
]
negative_keywords = [
  "survey", "systematic literature review", "position paper",
  "software architecture", "enterprise architecture", "building architecture",
  "agent-based simulation",
]

